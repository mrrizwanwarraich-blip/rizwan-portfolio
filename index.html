<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Muhammad Rizwan Javed — Administration & Operations Manager with 11+ years of experience in administration, project management and EHS. Admin Manager at Tech Mahindra Arabia on the NEOM project." />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved language and theme before first paint (see src/settings.jsx).
      try {
        var r = document.documentElement, t = localStorage.getItem('theme')
        if (localStorage.getItem('lang') === 'ar') { r.lang = 'ar'; r.dir = 'rtl' }
        r.dataset.theme = t === 'dark' ? 'dark' : 'light'
      } catch (e) { document.documentElement.dataset.theme = 'light' }
    </script>
    <title>Muhammad Rizwan Javed — Administration & Operations Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
