<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="Illustrated portrait">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ddab84"/><stop offset="1" stop-color="#cc9871"/></linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2d33"/><stop offset="1" stop-color="#0b0b0d"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c7b3"/><stop offset="1" stop-color="#c4ae97"/></linearGradient>
  </defs>
  <path d="M30 520c2-84 44-128 118-146l52 14 52-14c74 18 116 62 118 146z" fill="url(#top)"/>
  <!-- knit texture -->
  <g fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 9">
    <path d="M96 432v88M138 420v100M262 420v100M304 432v88"/>
  </g>
  <!-- placket and buttons -->
  <path d="M188 398h24v96h-24z" fill="#cdb9a3"/>
  <path d="M188 398v96M212 398v96" stroke="#b39c84" stroke-width="2"/>
  <circle cx="200" cy="428" r="4.5" fill="#9f8870"/><circle cx="200" cy="462" r="4.5" fill="#9f8870"/>
  <!-- neck -->
  <path d="M160 316h80l4 66q-44 28-88 0z" fill="#c08f69"/>
  <path d="M160 336q40 30 80 0l2 24q-42 24-84 0z" fill="#a87650" opacity=".7"/>
  <g transform="translate(0 32)">
  <!-- ears -->
  <ellipse cx="125" cy="228" rx="10" ry="17" fill="#cf9b74"/>
  <ellipse cx="275" cy="228" rx="10" ry="17" fill="#cf9b74"/>
  <!-- face -->
  <path d="M127 214c0-62 32-94 73-94s73 32 73 94c0 58-30 106-73 106s-73-48-73-106z" fill="url(#skin)"/>
  <!-- beard -->
  <path d="M128 230c2 20 6 34 12 46 12 28 34 48 60 48s48-20 60-48c6-12 10-26 12-46-9 20-21 32-35 35-9-8-23-11-37-11s-28 3-37 11c-14-3-26-15-35-35z" fill="#1d1714"/>
  <path d="M185 283q15 7 30 0" fill="none" stroke="#b9806a" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M122 196q10 14 9 44l-6-2zM278 196q-10 14-9 44l6-2z" fill="#18120f"/>
  <!-- hair: swept-up quiff -->
  <path d="M124 218c-9-44-2-86 24-110 28-26 86-32 116-8 24 19 22 62 13 118-3-26-9-44-20-57-32 13-88 11-116-6-10 16-15 36-17 63z" fill="#18120f"/>
  <path d="M150 122c30-26 80-28 108-8" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="7" stroke-linecap="round"/>
  <path d="M146 142c34-20 84-20 114-6" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="5" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M200 238v20q0 7-8 7" fill="none" stroke="#b9855f" stroke-width="4" stroke-linecap="round"/>
  <!-- sunglasses -->
  <g>
    <path d="M138 214l-13-3M262 214l13-3" stroke="#0e0e10" stroke-width="5" stroke-linecap="round"/>
    <rect x="137" y="203" width="56" height="42" rx="19" fill="url(#lens)"/>
    <rect x="207" y="203" width="56" height="42" rx="19" fill="url(#lens)"/>
    <path d="M193 219q7-7 14 0" fill="none" stroke="#0e0e10" stroke-width="5" stroke-linecap="round"/>
    <path d="M150 214l12-6M220 214l12-6" stroke="#fff" stroke-opacity=".28" stroke-width="4" stroke-linecap="round"/>
  </g>
  </g>
  <!-- polo collar -->
  <path d="M148 372l52 30-34 34-40-52z" fill="#e3d3c1"/>
  <path d="M252 372l-52 30 34 34 40-52z" fill="#e3d3c1"/>
  <path d="M148 372l52 30 52-30" fill="none" stroke="#b39c84" stroke-width="2.5" stroke-linejoin="round"/>
